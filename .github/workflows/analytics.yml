name: Daily Feltrinelli Analytics Run

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy psycopg2-binary python-dotenv requests beautifulsoup4

      - name: Run Analytics ETL Pipeline
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}

        run: |
          python scripts/converter.py
          python scripts/upload_to_db.py
          python scripts/run_analytics.py

      - name: Commit and Push Output CSVs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add outputs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update analytics reports [skip ci]" && git push)